<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; overflow:hidden; }

  .canvas {
    width:1080px; height:1080px;
    background: #060E1F;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }

  /* Background */
  .bg1 { position:absolute; top:-200px; left:-150px; width:800px; height:800px; background:radial-gradient(ellipse,rgba(255,206,61,.15) 0%,transparent 58%); }
  .bg2 { position:absolute; bottom:-200px; right:-120px; width:750px; height:750px; background:radial-gradient(ellipse,rgba(255,63,161,.12) 0%,transparent 58%); }
  .bg3 { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:600px; height:600px; background:radial-gradient(ellipse,rgba(183,148,244,.06) 0%,transparent 65%); }

  /* Frame */
  .frame {
    position:absolute; inset:40px;
    border:1px solid rgba(255,206,61,.22);
    border-radius:4px;
    pointer-events:none;
  }
  .corner { position:absolute; width:22px; height:22px; }
  .c-tl { top:-1px; left:-1px; border-top:2px solid rgba(255,206,61,.7); border-left:2px solid rgba(255,206,61,.7); }
  .c-tr { top:-1px; right:-1px; border-top:2px solid rgba(255,206,61,.7); border-right:2px solid rgba(255,206,61,.7); }
  .c-bl { bottom:-1px; left:-1px; border-bottom:2px solid rgba(255,206,61,.7); border-left:2px solid rgba(255,206,61,.7); }
  .c-br { bottom:-1px; right:-1px; border-bottom:2px solid rgba(255,206,61,.7); border-right:2px solid rgba(255,206,61,.7); }

  /* Content */
  .content { position:relative; z-index:2; text-align:center; padding:0 80px; width:100%; }

  .top-tag {
    display:inline-flex; align-items:center; gap:10px;
    background:rgba(255,63,161,.12); border:1px solid rgba(255,63,161,.3);
    border-radius:100px; padding:8px 22px; margin-bottom:40px;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:#FF3FA1;
  }
  .top-tag-dot { width:6px; height:6px; background:#FF3FA1; border-radius:50%; box-shadow:0 0 8px rgba(255,63,161,.9); }

  .main-title {
    font-family:'Cormorant Garamond',Georgia,serif;
    font-style:italic; font-weight:300;
    font-size:130px; line-height:.88; letter-spacing:-.03em;
    margin-bottom:16px;
  }
  .main-title .line1 { display:block; color:rgba(253,252,250,.9); }
  .main-title .line2 {
    display:block;
    background:linear-gradient(120deg,#FFCE3D 20%,#FF8C00 60%,#FF3FA1 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .main-title .line3 { display:block; color:rgba(253,252,250,.9); }

  .sub {
    font-family:'Cormorant Garamond',Georgia,serif;
    font-style:italic; font-size:28px; font-weight:400;
    color:rgba(253,252,250,.42); letter-spacing:.02em; margin-bottom:48px;
  }

  /* Info row */
  .info-row {
    display:flex; justify-content:center; gap:0; margin-bottom:44px;
  }
  .info-item {
    padding:0 32px; text-align:center; position:relative;
  }
  .info-item+.info-item::before {
    content:''; position:absolute; left:0; top:15%; height:70%;
    width:1px; background:rgba(255,206,61,.22);
  }
  .info-val {
    font-family:'Cormorant Garamond',Georgia,serif;
    font-style:italic; font-size:22px; font-weight:500;
    color:#FDFCFA; line-height:1.1; margin-bottom:4px;
  }
  .info-lbl {
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,206,61,.6);
  }

  /* Bottom */
  .bottom-strip {
    display:flex; align-items:center; justify-content:center; gap:16px;
  }
  .coaches-names {
    font-family:'Cormorant Garamond',Georgia,serif;
    font-style:italic; font-size:20px; font-weight:400;
    color:rgba(253,252,250,.5);
  }
  .sep { color:rgba(255,206,61,.4); font-size:18px; }
  .price-chip {
    background:linear-gradient(135deg,rgba(255,206,61,.18),rgba(255,206,61,.08));
    border:1px solid rgba(255,206,61,.45); border-radius:100px;
    padding:10px 26px;
    font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:700;
    color:#FFCE3D; letter-spacing:.03em;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg1"></div><div class="bg2"></div><div class="bg3"></div>
  <div class="frame">
    <div class="corner c-tl"></div><div class="corner c-tr"></div>
    <div class="corner c-bl"></div><div class="corner c-br"></div>
  </div>

  <div class="content">
    <div class="top-tag"><div class="top-tag-dot"></div> KI-Workshop · Witten · 3. & 4. Juli 2026 <div class="top-tag-dot"></div></div>

    <div class="main-title">
      <span class="line1">Die</span>
      <span class="line2">Unver&shy;wechsel</span>
      <span class="line3">baren</span>
    </div>

    <div class="sub">In 2 Tagen. Unverwechselbar statt unsichtbar.</div>

    <div class="info-row">
      <div class="info-item">
        <div class="info-val">3. & 4. Juli</div>
        <div class="info-lbl">Datum</div>
      </div>
      <div class="info-item">
        <div class="info-val">Witten · NRW</div>
        <div class="info-lbl">Location</div>
      </div>
      <div class="info-item">
        <div class="info-val">max. 9 Personen</div>
        <div class="info-lbl">Gruppe</div>
      </div>
    </div>

    <div class="bottom-strip">
      <div class="coaches-names">Claudia · Gabi · Ann-Kathrin</div>
      <div class="sep">·</div>
      <div class="price-chip">ab 397 € Frühbucher</div>
    </div>
  </div>
</div>
</body>
</html>
